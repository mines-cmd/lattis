# Built-in Ember colors: near-black blue-tinted slate with ember-orange accents from the logo.

[palette]
background = "#0d1117"
surface = "#161b22"
surface_raised = "#262b31"
surface_hover = "#30363d"
border = "#f0f6fc1a"
hover_overlay = "#b1bac40f"
selected_overlay = "#b1bac421"
text = "#e6edf3"
