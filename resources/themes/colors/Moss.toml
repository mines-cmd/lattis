# Built-in Moss colors: Ember's dark slate with a moss-green accent.
extends = "Ember"

[palette]
accent = "#67a715"
accent_end = "#569209"
hover_overlay = "#9baec42a"

[launch_button]
running_background = "#04a5ff"
running_background_end = "#0379ff"
background = "#78b922"
background_end = "#49b018"

[rail]
dog_background = "@launch_button.background"
dog_background_end = "@launch_button.background_end"
dog_coat = "#fcfef4"
dog_coat_end = "#d6e0bc"
dog_details = "#207e7c"

[onboarding]
background = "#050a05"

[list]
running_color = "#78b922"
row_hover = "#9baec42a"
row_selected = "#97a8bc4b"
