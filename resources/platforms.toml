# Platforms, in rail order. Games refer to a platform by its id.
#
# `id` is permanent once games use it: every game file names its platform by id. Use
# lowercase a-z, 0-9 and -. `name` is what the app shows, and can change any time.
# `icon` is an icon name from the app (switch, switch2, 3ds, wiiu, wii, gamecube, n64, snes, nes,
# genesis, dreamcast, sms, gamegear, arcade, nds, gb, gbc, gba, psp, ps1, ps2, ps3, ps4, steam,
# proton, linux, gamepad); optional.
# `color` is the platform's color in the Library overview, like "#3c94d0"; optional. The built-in
# platforms have their own; others take the next one from the theme's [overview] platform_colors.
#
# `emulators` lists emulator ids in order of preference (see emulators.reference.toml).
# `rom_folders` are scanned for games at startup; a relative path is inside the data dir.
# Add them in Settings → Platforms, or here: rom_folders = ["~/Games/switch"]
#
# The app wrote this file with its default platforms because there wasn't one; it's yours
# to change. A platform without games doesn't show in the rail. Delete the file to get the
# defaults back.

# ids Lattis has offered as defaults; it adds a default that isn't here once, and delete one from here
# to have it offered again.
offered = [
    "switch", "switch/eden", "switch/ryubing", "switch/lichii",
    "switch-2", "switch-2/lichii",
    "3ds", "3ds/azahar",
    "wiiu", "wiiu/cemu",
    "wii", "wii/dolphin",
    "gamecube", "gamecube/dolphin",
    "n64", "n64/rmg",
    "snes", "snes/snes9x",
    "nes", "nes/punes",
    "nds", "nds/melonds",
    "gba", "gba/mgba",
    "gbc", "gbc/mgba",
    "gb", "gb/mgba",
    "dreamcast", "dreamcast/flycast",
    "genesis", "genesis/blastem",
    "sms", "sms/ares",
    "gamegear", "gamegear/ares",
    "ps4", "ps4/shadps4",
    "ps3", "ps3/rpcs3",
    "ps2", "ps2/pcsx2",
    "ps1", "ps1/duckstation",
    "psp", "psp/ppsspp",
    "arcade", "arcade/mame",
]

