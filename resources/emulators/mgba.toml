# mGBA (Game Boy Advance, Game Boy, Game Boy Color). Built into the app; change it in library/emulators.toml.
# Checked against Flathub and the releases, 2026-09; Game Boy and Game Boy Color added 2026-11-20
# (it opens all three with a bare path and writes the same saves, states and screenshots for each).
id = "mgba"
name = "mGBA"
platforms = ["gba", "gb", "gbc"]
flatpak = "io.mgba.mGBA"
executables = ["mgba-qt", "mgba"]
# Releases are mGBA-*-appimage-x64.appimage.
appimage = "mGBA*.AppImage"
release = "github:mgba-emu/mgba"
release_asset = "mGBA-*-appimage-x64.appimage"
command = ["{exe}", "{args}", "{rom}"]
# Each platform scans only its own files, so a GBA folder doesn't pick up .gb.
extensions = ["gba", "gb", "gbc"]
platform_extensions = { gba = ["gba"], gb = ["gb"], gbc = ["gbc"] }
# Saves and save states are written next to the ROM unless its settings choose a folder
# (savegamePath, savestatePath; src/core/directories.c, 2026-09), so there's no save
# folder here. It needs no keys (the BIOS is optional, and where it is
# is up to you).
# Next to the ROM, under its name: .sav (.sa2 to .sa4 for players 2 to 4) and the save
# states .ss0 to .ss9 (src/core/core.c, 2026-09).
saves_beside_rom = ["sav", "sa2", "sa3", "sa4", "ss0", "ss1", "ss2", "ss3", "ss4", "ss5", "ss6", "ss7", "ss8", "ss9"]
# Next to the ROM as <ROM file name>-<number>.png, unless its screenshot folder is set.
screenshots = { native = "{romdir}/{rom}-[0-9]*.png", flatpak = "{romdir}/{rom}-[0-9]*.png" }
