# Tags and their colors. `color` is an index into the theme's tags.palette.
# A game can use a tag that isn't listed here; it shows in the first color.
#
# `igdb` says what a tag stands for on IGDB, so looking a game up there can suggest it:
# "genre:<id>", "theme:<id>", "mode:<id>" (game mode) or "keyword:<slug>". A tag fits a
# game when any of them does. `igdb = []` never suggests the tag.
#
# The app wrote this file with its default tags when it made the library; they're yours
# to rename, recolor or delete. Settings → Library's "Add default tags" brings back the
# ones you don't have.

[[tag]]
name = "Metroidvania"
color = 10
igdb = ["keyword:metroidvania"]

[[tag]]
name = "Roguelike"
color = 0
igdb = ["keyword:roguelike", "keyword:roguelite", "keyword:action-roguelike", "keyword:action-roguelite", "keyword:traditional-roguelike", "keyword:roguelike-deckbuilder", "keyword:roguelike-platform", "keyword:roguelike-horror"]

[[tag]]
name = "Soulslike"
color = 23
igdb = ["keyword:soulslike"]

[[tag]]
